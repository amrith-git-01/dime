[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "boto3>=1.43.2",
    "cryptography>=43.0.0",
    "fastapi[standard]>=0.136.1",
    "httpx>=0.28.1",
    "imageio-ffmpeg>=0.6.0",
    "langchain-core>=1.4.6",
    "langchain-openai>=1.3.0",
    "langgraph>=1.2.4",
    "pydantic-settings>=2.14.0",
    "pyjwt>=2.8.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.49",
    "supabase>=2.29.0",
    "tzdata>=2026.2",
    "uvicorn>=0.46.0",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
# Required fields use AliasChoices for env compatibility (Supabase docs).
warn_required_dynamic_aliases = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
