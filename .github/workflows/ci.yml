name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Settings require these at import time; values are dummies (tests mock Supabase).
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_KEY: dummy-publishable-key
      SUPABASE_SECRET_KEY: dummy-secret-key
      SUPABASE_JWT_SECRET: dummy-jwt-secret
      EMAIL_UNSUBSCRIBE_SECRET: dummy-unsubscribe-secret
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - name: mypy (non-blocking for now)
        run: uv run mypy .
        continue-on-error: true
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test --if-present

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # wrangler and supabase-js require Node >= 22.
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Bundle builds (wrangler dry run)
        run: npx wrangler deploy --dry-run --outdir dist
