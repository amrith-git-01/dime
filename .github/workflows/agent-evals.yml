name: Agent evals

# Never runs on pushes or pull requests: it calls a real LLM (DeepSeek) and a deployed or local API, so it
# costs money and takes ~15 minutes (the AI rate limit allows 10 requests per user per minute).
# Runs weekly and on demand.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:
    inputs:
      filter:
        description: "Only conversations whose id or a question contains this text (empty = all)"
        required: false
        default: ""
      min_tool:
        description: "Fail below this tool-selection accuracy (0..1)"
        required: false
        default: "0.85"
      min_numeric:
        description: "Fail below this numeric accuracy (0..1)"
        required: false
        default: "0.9"

permissions:
  contents: read

concurrency:
  group: agent-evals
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: api
    env:
      # Required repository secrets (a STAGING API whose database holds api/evals/seed.sql and the agent v2 migration,
      # with a real DEEPSEEK_API_KEY and AGENT_MEMORY_SECRET set on that Worker):
      #   EVAL_BASE_URL       e.g. https://dime-api-staging.<subdomain>.workers.dev
      #   EVAL_JWT_SECRET     the staging project's legacy HS256 JWT secret (the runner mints the fixture user's token), OR
      #   EVAL_ACCESS_TOKEN   an access token of the fixture user (expires: prefer the secret)
      #   EVAL_SUPABASE_URL   the staging Supabase URL (the token's issuer) when EVAL_JWT_SECRET is used
      EVAL_BASE_URL: ${{ secrets.EVAL_BASE_URL }}
      EVAL_JWT_SECRET: ${{ secrets.EVAL_JWT_SECRET }}
      EVAL_ACCESS_TOKEN: ${{ secrets.EVAL_ACCESS_TOKEN }}
      EVAL_SUPABASE_URL: ${{ secrets.EVAL_SUPABASE_URL }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$EVAL_BASE_URL" ]; then echo "::error::Missing secret EVAL_BASE_URL"; exit 1; fi
          if [ -z "$EVAL_ACCESS_TOKEN" ] && { [ -z "$EVAL_JWT_SECRET" ] || [ -z "$EVAL_SUPABASE_URL" ]; }; then
            echo "::error::Set EVAL_ACCESS_TOKEN, or EVAL_JWT_SECRET together with EVAL_SUPABASE_URL"; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Run the golden questions
        env:
          MIN_TOOL: ${{ inputs.min_tool || '0.85' }}
          MIN_NUMERIC: ${{ inputs.min_numeric || '0.9' }}
          FILTER: ${{ inputs.filter }}
        run: |
          args=(--min-tool "$MIN_TOOL" --min-numeric "$MIN_NUMERIC")
          if [ -n "$FILTER" ]; then args+=(--filter "$FILTER"); fi
          npm run evals -- "${args[@]}"
      - name: Job summary
        if: always()
        run: |
          latest=$(ls -t evals/reports/*.md 2>/dev/null | head -1)
          if [ -n "$latest" ]; then cat "$latest" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-eval-reports
          path: api/evals/reports/
          if-no-files-found: ignore
