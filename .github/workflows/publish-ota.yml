name: Publish OTA

# Deploy API succeeded on main -> publish the signed OTA update for the runtime version in frontend/app.json.
# The API is already live at this point (migrations + Worker), which is the order an OTA needs.
# Manual run / rollback: Actions -> Publish OTA -> Run workflow, with `ref` set to the commit to (re)publish.
#
# Repository (or `production` environment) secrets:
#   DIME_UPDATES_PRIVATE_KEY  contents of keys/private-key.pem (the OTA signing key)
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID  already used by Deploy API (the token needs Workers R2 Storage:Edit)
# Repository variables (public values baked into the bundle, same as frontend/.env):
#   EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID, EXPO_PUBLIC_API_BASE_URL, EXPO_PUBLIC_SENTRY_DSN

on:
  workflow_run:
    workflows: [Deploy API]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag or branch to publish (default main)
        default: main
      allow_native_changes:
        description: Publish even though native files changed without a version bump
        type: boolean
        default: false

permissions:
  contents: read

# One publish at a time, in order; never cancel one that is uploading.
concurrency:
  group: publish-ota
  cancel-in-progress: false

jobs:
  publish:
    name: Publish OTA to production
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: production
    env:
      EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
      EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
      EXPO_PUBLIC_SENTRY_DSN: ${{ vars.EXPO_PUBLIC_SENTRY_DSN }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, publish exactly the commit that was deployed.
          ref: ${{ github.event.workflow_run.head_sha || inputs.ref }}
          fetch-depth: 2

      - name: Decide whether to publish
        id: gate
        env:
          ALLOW_NATIVE: ${{ inputs.allow_native_changes }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            changed=$(git diff --name-only HEAD^1 HEAD)
            if ! echo "$changed" | grep -q '^frontend/'; then
              echo "No frontend changes in this push; nothing to publish."
              echo "publish=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Native files changed without a runtime version bump would ship JS the installed APKs cannot run.
            if echo "$changed" | grep -Eq '^frontend/(android/|plugins/|app\.config\.js|package\.json)'; then
              old=$(git show HEAD^1:frontend/app.json | grep -m1 '"version"')
              new=$(grep -m1 '"version"' frontend/app.json)
              if [ "$old" = "$new" ] && [ "$ALLOW_NATIVE" != "true" ]; then
                echo "::error::Native-affecting files changed but the app version is unchanged ($new). Bump it and ship a new APK, or run this workflow manually with allow_native_changes."
                exit 1
              fi
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          # wrangler (installed in api/) requires Node >= 22.
          node-version: 22

      - name: Install
        if: steps.gate.outputs.publish == 'true'
        run: |
          npm ci --prefix frontend
          npm ci --prefix api

      - name: Publish update
        if: steps.gate.outputs.publish == 'true'
        env:
          KEY: ${{ secrets.DIME_UPDATES_PRIVATE_KEY }}
        working-directory: frontend
        run: |
          key_file="$RUNNER_TEMP/ota-private-key.pem"
          umask 077
          printf '%s\n' "$KEY" > "$key_file"
          export DIME_UPDATES_PRIVATE_KEY="$key_file"
          msg=$(git log -1 --format=%s)
          npm run publish:update -- --message "$msg"
          rm -f "$key_file"
