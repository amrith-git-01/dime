name: Deploy API

# Push to main -> CI (api, frontend, backend) -> staging deploy + smoke test -> production deploy + smoke test.
# Production only runs when staging succeeded. Manual runs (Actions -> Deploy API -> Run workflow) can target
# either environment on their own.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   token with Workers Scripts:Edit, D1:Edit, Workers R2 Storage:Edit, Queues:Edit, Workers AI:Read, Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  the account id (`npx wrangler whoami`)
#
# Create two GitHub Environments, `staging` and `production`. Optional: enable "Required reviewers" on
# `production` (Settings -> Environments -> production) to approve each production deploy by hand;
# without it, production deploys automatically after staging.
#
# Worker secrets (AUTH_JWT_SECRET, MEDIA_URL_SECRET, DEEPSEEK_API_KEY, ...) are NOT managed here: set them once with
# `wrangler secret put` (see api/DEPLOY.md). The D1 database, R2 bucket and queues must already exist.
# D1 migrations (api/migrations) are applied by the workflow right before each deploy.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

# One deploy per environment at a time; never cancel a deploy that is already running.
concurrency:
  group: deploy-api-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  staging:
    name: Deploy to staging
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      || (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, deploy exactly the commit CI validated.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        working-directory: api
        run: npm ci
      - name: Refuse to deploy placeholder config
        working-directory: api
        run: |
          if grep -q 'REPLACE-ME' wrangler.jsonc; then echo "wrangler.jsonc still contains REPLACE-ME placeholders (GOOGLE_WEB_CLIENT_ID / EMAIL_PUBLIC_BASE_URL)"; exit 1; fi
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then echo "wrangler.jsonc still has the placeholder D1 database_id"; exit 1; fi
      - name: Apply D1 migrations (staging)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: d1 migrations apply DB --remote --env staging
      - name: Deploy (staging)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: deploy --env staging
      - name: Smoke test
        if: steps.deploy.outputs.deployment-url != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "${{ steps.deploy.outputs.deployment-url }}/api/v1/health"

  production:
    name: Deploy to production
    needs: staging
    # always(): a manual production run skips the staging job, which would otherwise skip this one too.
    if: >-
      always() && (
        (github.event_name == 'workflow_run' && needs.staging.result == 'success')
        || (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
      )
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          # For workflow_run, ship exactly the commit CI validated and staging received.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install
        working-directory: api
        run: npm ci
      - name: Typecheck, lint and test the exact commit being shipped
        working-directory: api
        run: |
          npm run typecheck
          npm run lint
          npm test
      - name: Refuse to deploy placeholder config
        working-directory: api
        run: |
          if grep -q 'REPLACE-ME' wrangler.jsonc; then echo "wrangler.jsonc still contains REPLACE-ME placeholders (GOOGLE_WEB_CLIENT_ID / EMAIL_PUBLIC_BASE_URL)"; exit 1; fi
          if grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' wrangler.jsonc; then echo "wrangler.jsonc still has the placeholder D1 database_id"; exit 1; fi
      - name: Apply D1 migrations (production)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: d1 migrations apply DB --remote
      - name: Deploy (production)
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
          wranglerVersion: "4"
          command: deploy
      - name: Smoke test
        if: steps.deploy.outputs.deployment-url != ''
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-connrefused "${{ steps.deploy.outputs.deployment-url }}/api/v1/health"
